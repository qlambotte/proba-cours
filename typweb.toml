# Réglages du site « Probabilités » (voir ../../../typweb/gabarit/typweb.toml)

[cours]
titre      = "Probabilités"
sous-titre = "Cours & exercices — 6e, 4 périodes (6UAA1)"
auteur     = "Quentin Lambotte"
annee      = "6e"
uaa        = "6UAA1"
depot      = "https://github.com/qlambotte/proba-cours"
site-url   = "https://qlambotte.github.io/proba-cours/"
portail    = "https://qlambotte.github.io/6e.html" 
figure     = "arbre"
[notes]
dossier    = "../notes"
principal  = "proba.typ"
# Exercices supplémentaires : en fin de chapitre sur le site (numéros S1.1…)
[[notes.complements]]
fichier  = "fiches/exercices-supp-ch1.typ"
id       = "6UAA1.exercices-supplementaires"
chapitre = 1
titre    = "Exercices supplémentaires"
[[notes.complements]]
fichier  = "fiches/exercices-supp-ch2.typ"
id       = "6UAA1.exercices-supplementaires-2"
chapitre = 2
titre    = "Exercices supplémentaires"
[[notes.complements]]
fichier  = "fiches/exercices-supp-ch3.typ"
id       = "6UAA1.exercices-supplementaires-3"
chapitre = 3
titre    = "Exercices supplémentaires"
# Références : page du site seulement (le livre donne les sources en notes de bas de page)
[[notes.complements]]
fichier  = "references.typ"
id       = "6UAA1.references"
chapitre = 3
titre    = "Références"

[pdf]
corrige    = true
# Fiches d'exercices supplémentaires (élève ; corrigé = réponses en bleu)
[[pdf.autres]]
titre   = "Exercices supplémentaires — chapitre 1"
fichier = "exercices-supp-ch1.pdf"
source  = "fiches/exercices-supp-ch1.typ"
[[pdf.autres]]
titre   = "Exercices supplémentaires — chapitre 2"
fichier = "exercices-supp-ch2.pdf"
source  = "fiches/exercices-supp-ch2.typ"
[[pdf.autres]]
titre   = "Exercices supplémentaires — chapitre 3"
fichier = "exercices-supp-ch3.pdf"
source  = "fiches/exercices-supp-ch3.typ"

[[pdf.autres]]
titre   = "Exercices supplémentaires — chapitre 1 (corrigé)"
fichier = "exercices-supp-ch1-corrige.pdf"
source  = "fiches/exercices-supp-ch1.typ"
corrige = true
[[pdf.autres]]
titre   = "Exercices supplémentaires — chapitre 2 (corrigé)"
fichier = "exercices-supp-ch2-corrige.pdf"
source  = "fiches/exercices-supp-ch2.typ"
corrige = true
[[pdf.autres]]
titre   = "Exercices supplémentaires — chapitre 3 (corrigé)"
fichier = "exercices-supp-ch3-corrige.pdf"
source  = "fiches/exercices-supp-ch3.typ"
corrige = true

[modules]
# proba : arbres, Venn, partitions, simulateur, dénombreur ; reperes : repères cetz-plot ; relevé des sommes de deux dés dans proba
actifs = ["proba", "reperes"]
